name: Offline checks
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'refactor/**', 'docs/**']
  pull_request:
    branches: [main]
jobs:
  check:
    # Verified global runner label; lab404Runner was offline at stage 0.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.3
          uv sync --locked --extra stata --group dev
      - name: Run shared offline gate
        run: uv run --locked --extra stata --group dev python scripts/check.py
      - name: Verify installed CLI
        run: uv run --locked --extra stata --group dev econ-agent --version
