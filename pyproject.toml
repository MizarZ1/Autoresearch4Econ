[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "econ-agent"
version = "0.1.0rc1"
description = "通过 Stata MCP 开展实证经济研究的中文命令行程序"
requires-python = ">=3.11"
dependencies = ["openai>=1.100,<3", "pydantic>=2.11,<3"]

[project.optional-dependencies]
stata = ["mcp-stata==3.3.0", "mcp>=1.26,<2", "numpy==1.26.4", "pandas>=2.2,<3"]

[dependency-groups]
dev = ["ruff>=0.14,<1", "mypy>=1.18,<2", "pytest>=8,<10", "pytest-asyncio>=1.3,<2"]

[project.scripts]
econ-agent = "econ_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/econ_agent"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/econ_agent", "/scripts", "/tests", "/docs", "/examples/methods",
  "/examples/quickstart", "/examples/demo/materials", "/examples/demo/reference",
  "/examples/demo/task.json", "/examples/demo/sources.json", "/.gitea", "/.github",
  "/README.md", "/CONTRIBUTING.md", "/CHANGELOG.md", "/AGENTS.md",
  "/.env.example", "/.gitignore", "/pyproject.toml", "/uv.lock",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts", "tests"]

# schemas 中的 Pydantic 联合入口在 macOS 需忽略 arg-type，Linux 类型签名则可接受。
# 仅允许此模块的跨平台忽略项冗余，不关闭任何实际类型错误检查。
[[tool.mypy.overrides]]
module = "econ_agent.schemas"
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract"]
pythonpath = ["."]
asyncio_mode = "auto"
